<div class="container text-center mt-4">
    <h3 class="mb-3">Webcam Feed</h3>
    <video #video width="640" height="480" autoplay muted></video>
    <br />
    <button class="btn btn-success m-2" (click)="startCamera()">Start</button>
    <button class="btn btn-danger m-2" (click)="stopCamera()">Stop</button>
    <canvas #canvas width="640" height="480" class="d-none"></canvas>
  </div>
