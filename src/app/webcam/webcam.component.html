<div class="container text-center mt-4 position-relative" style="width: 640px; height: 480px;">
    <video #video width="640" height="480" autoplay muted style="position: absolute; z-index: 1;"></video>
    <canvas #canvas width="640" height="480" style="position: absolute; z-index: 2;"></canvas>
  </div>
  
  <div class="mt-3">
    <button class="btn btn-success m-2" (click)="startCamera()">Start</button>
    <button class="btn btn-danger m-2" (click)="stopCamera()">Stop</button>
  </div>
